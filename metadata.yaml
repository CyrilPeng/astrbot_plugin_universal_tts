name: astrbot_plugin_universal_tts
display_name: 通用 TTS
short_desc: 多引擎通用 TTS：MiMo / OpenAI / 火山引擎 / 阿里云 / Azure / ElevenLabs / 自定义 HTTP，支持运行时热切换
desc: 通用 TTS 插件，支持多引擎切换（MiMo V2/V2.5、OpenAI 兼容、火山引擎、阿里云百炼、Azure、ElevenLabs、自定义 HTTP），通过消息链钩子在发送前将文本替换为语音，并提供 WebUI 管理页：引擎增删改查/排序/试听、音色样本上传下载重命名、会话绑定管理、全局设置与变更历史，支持配置导入导出。
version: 1.4.3
author: 某不科学的高数
repo: https://github.com/CyrilPeng/astrbot_plugin_universal_tts
astrbot_version: ">=4.25.0"
# 仅声明经源码核实、适配器确实会把 Record 组件发出去的平台。
# mattermost / line / misskey 形式待确认，qq_official_webhook 无 Record 处理，均未列入。
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - discord
  - kook
  - lark
  - satori
  - slack
  - webchat
  - wecom
  - wecom_ai_bot
  - weixin_oc
  - weixin_official_account
  - dingtalk
help: |
  所有指令均需以 / 开头，完整说明见 WebUI 的「指令与帮助」页。

  普通指令
  /tts_help             查看指令帮助与当前状态
  /tts_status           查看总开关、全局引擎与本会话状态
  /tts_engines          列出全部引擎与编号
  /tts_bind [序号]      当前会话固定使用某个引擎（0 = 本会话禁音）
  /tts_unbind           解除当前会话绑定
  /tts_test [文本]      立即合成一条语音验证配置

  管理员指令
  /tts_switch [序号]    切换全局默认引擎（0 = 关闭全局默认）
  /tts_bindings         列出所有会话绑定
  /tts_unbind_all       清除全部会话绑定
  /tts_off              暂停所有会话的自动合成
  /tts_on               恢复自动合成
  /tts_limit_on         开启文本长度上限
  /tts_limit_off        关闭文本长度上限
  /tts_limit_set <数字> 设置文本长度上限
social_link: https://github.com/CyrilPeng
