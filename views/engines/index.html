<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>通用 TTS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-head">
        <div class="page-title-wrap">
          <h1 id="page-title">通用 TTS 管理</h1>
          <p id="page-desc" class="muted"></p>
        </div>
        <button id="btn-new" class="btn btn-primary" type="button">新建引擎</button>
      </header>

      <div id="banner" class="banner" hidden></div>
      <div id="notice" class="banner banner-info" hidden></div>
      <audio id="player" class="player" controls hidden></audio>

      <div id="list" class="list" role="list"></div>
      <p id="empty" class="empty" hidden></p>
    </div>

    <dialog id="confirm" class="editor confirm">
      <div class="editor-head">
        <h2>确认</h2>
      </div>
      <div class="editor-body">
        <p id="confirm-message" class="confirm-message"></p>
      </div>
      <div class="editor-foot">
        <div class="editor-foot-right">
          <button id="confirm-cancel" class="btn" type="button">取消</button>
          <button id="confirm-ok" class="btn btn-danger" type="button">确定</button>
        </div>
      </div>
    </dialog>

    <dialog id="editor" class="editor">
      <div class="editor-head">
        <h2 id="editor-title">编辑引擎</h2>
        <button id="btn-close" class="btn btn-ghost" type="button" aria-label="close">✕</button>
      </div>

      <div class="editor-body">
        <div id="editor-error" class="banner" hidden></div>

        <label id="template-field" class="field" hidden>
          <span class="field-label">引擎类型</span>
          <select id="template-select"></select>
        </label>

        <div id="fields" class="fields"></div>
      </div>

      <div class="editor-foot">
        <button id="btn-preview" class="btn" type="button">试听</button>
        <div class="editor-foot-right">
          <button id="btn-cancel" class="btn" type="button">取消</button>
          <button id="btn-save" class="btn btn-primary" type="button">保存</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
