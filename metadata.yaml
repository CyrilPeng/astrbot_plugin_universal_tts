name: astrbot_plugin_universal_tts
display_name: 通用 TTS
short_desc: 多引擎通用 TTS（原项目分支）：音色克隆 + 歌曲生成 + 图片生成 + 自动内容路由
desc: CyrilPeng/astrbot_plugin_universal_tts 的分支，保留原项目全部引擎与管理功能（MiMo V2.5、OpenAI 兼容、火山引擎、阿里云百炼、Azure、ElevenLabs、自定义 HTTP），新增 OpenAI 兼容音色克隆、Unsloth 歌曲/音乐生成、Unsloth 图片生成，并按用户消息自动路由到 TTS/音乐/图片引擎；提供 WebUI 管理页、会话绑定、全局设置与配置导入导出。
version: 1.4.5
author: 某不科学的高数
repo: https://github.com/PowerShadows-wq/astrbot_plugin_universal_tts.git
astrbot_version: ">=4.25.0"
# 仅声明经源码核实、适配器确实会把 Record 组件发出去的平台。
# mattermost / line / misskey 形式待确认，qq_official_webhook 无 Record 处理，均未列入。
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - discord
  - kook
  - lark
  - satori
  - slack
  - webchat
  - wecom
  - wecom_ai_bot
  - weixin_oc
  - weixin_official_account
  - dingtalk
help: |
  所有指令均需以 / 开头，完整说明见 WebUI 的「指令与帮助」页。

  普通指令
  /tts_help             查看指令帮助与当前状态
  /tts_status           查看总开关、全局引擎与本会话状态
  /tts_engines          列出全部引擎与编号
  /tts_bind [序号]      当前会话固定使用某个引擎（0 = 本会话禁音）
  /tts_unbind           解除当前会话绑定
  /tts_test [文本]      立即合成一条语音验证配置

  管理员指令
  /tts_switch [序号]    切换全局默认引擎（0 = 关闭全局默认）
  /tts_bindings         列出所有会话绑定
  /tts_unbind_all       清除全部会话绑定
  /tts_off              暂停所有会话的自动合成
  /tts_on               恢复自动合成
  /tts_limit_on         开启文本长度上限
  /tts_limit_off        关闭文本长度上限
  /tts_limit_set <数字> 设置文本长度上限
social_link: https://github.com/CyrilPeng
