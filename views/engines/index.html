<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>通用 TTS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-head">
        <div class="page-title-wrap">
          <h1 id="page-title">通用 TTS 管理</h1>
          <p id="page-desc" class="muted"></p>
        </div>
      </header>

      <div id="banner" class="banner" hidden></div>
      <div id="notice" class="banner banner-info" hidden></div>
      <audio id="player" class="player" controls hidden></audio>

      <nav class="tabs" role="tablist">
        <button
          id="tab-engines-btn"
          class="tab tab-active"
          type="button"
          role="tab"
          data-tab="engines"
        >
          引擎
        </button>
        <button id="tab-samples-btn" class="tab" type="button" role="tab" data-tab="samples">
          音色样本
        </button>
        <button id="tab-bindings-btn" class="tab" type="button" role="tab" data-tab="bindings">
          会话绑定
        </button>
        <button id="tab-settings-btn" class="tab" type="button" role="tab" data-tab="settings">
          全局设置
        </button>
        <button id="tab-help-btn" class="tab" type="button" role="tab" data-tab="help">
          指令与帮助
        </button>
      </nav>

      <section id="tab-engines" class="tab-panel" role="tabpanel">
        <div id="summary" class="summary"></div>
        <div class="panel-head">
          <p id="engines-hint" class="muted"></p>
          <button id="btn-new" class="btn btn-primary" type="button">新建引擎</button>
        </div>
        <div id="list" class="list" role="list"></div>
        <p id="empty" class="empty" hidden></p>
      </section>

      <section id="tab-samples" class="tab-panel" role="tabpanel" hidden>
        <div class="panel-head">
          <p id="samples-hint" class="muted"></p>
          <button id="btn-upload-sample" class="btn btn-primary" type="button">上传样本</button>
        </div>
        <div id="samples-list" class="list" role="list"></div>
        <p id="samples-empty" class="empty" hidden></p>
      </section>

      <section id="tab-bindings" class="tab-panel" role="tabpanel" hidden>
        <div class="panel-head">
          <p id="bindings-hint" class="muted"></p>
          <button id="btn-clear-bindings" class="btn btn-danger" type="button">全部解绑</button>
        </div>
        <div id="bindings-list" class="list" role="list"></div>
        <p id="bindings-empty" class="empty" hidden></p>
      </section>

      <section id="tab-settings" class="tab-panel" role="tabpanel" hidden>
        <div class="panel-head">
          <p id="settings-hint" class="muted"></p>
          <div class="head-actions">
            <label class="inline-check">
              <input id="export-secrets" type="checkbox" />
              <span id="export-secrets-label">含密钥</span>
            </label>
            <button id="btn-export" class="btn" type="button">导出</button>
            <button id="btn-import" class="btn" type="button">导入</button>
            <button id="btn-save-settings" class="btn btn-primary" type="button">
              保存设置
            </button>
          </div>
        </div>
        <div id="settings-fields" class="fields"></div>

        <div class="history-block">
          <div class="panel-head">
            <p id="history-hint" class="muted"></p>
            <button id="btn-refresh-history" class="btn" type="button">刷新</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </div>
      </section>

      <section id="tab-help" class="tab-panel" role="tabpanel" hidden>
        <div id="help-snapshot" class="summary"></div>

        <div class="help-section">
          <h3 id="help-quickstart-title">快速上手</h3>
          <ul id="help-quickstart" class="help-list"></ul>
        </div>

        <div class="help-section">
          <h3 id="help-commands-title">指令列表</h3>
          <div id="help-commands" class="help-commands"></div>
        </div>

        <div class="help-section">
          <h3 id="help-permissions-title">权限说明</h3>
          <ul id="help-permissions" class="help-list"></ul>
        </div>

        <div class="help-section">
          <h3 id="help-faq-title">常见问题</h3>
          <ul id="help-faq" class="help-list"></ul>
        </div>
      </section>
    </div>

    <dialog id="confirm" class="editor confirm">
      <div class="editor-head">
        <h2>确认</h2>
      </div>
      <div class="editor-body">
        <p id="confirm-message" class="confirm-message"></p>
      </div>
      <div class="editor-foot">
        <div class="editor-foot-right">
          <button id="confirm-cancel" class="btn" type="button">取消</button>
          <button id="confirm-ok" class="btn btn-danger" type="button">确定</button>
        </div>
      </div>
    </dialog>

    <dialog id="editor" class="editor">
      <div class="editor-head">
        <h2 id="editor-title">编辑引擎</h2>
        <button id="btn-close" class="btn btn-ghost" type="button" aria-label="close">✕</button>
      </div>

      <div class="editor-body">
        <div id="editor-error" class="banner" hidden></div>

        <label id="template-field" class="field" hidden>
          <span class="field-label">引擎类型</span>
          <select id="template-select"></select>
        </label>

        <div id="fields" class="fields"></div>
      </div>

      <div class="editor-foot">
        <button id="btn-preview" class="btn" type="button">试听</button>
        <div class="editor-foot-right">
          <button id="btn-cancel" class="btn" type="button">取消</button>
          <button id="btn-save" class="btn btn-primary" type="button">保存</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
